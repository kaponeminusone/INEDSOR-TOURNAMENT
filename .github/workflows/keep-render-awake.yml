name: Keep Render awake

# El free tier de Render duerme el servicio tras 15 min sin peticiones.
# Este workflow le hace ping cada 10 min para que no se apague.
#
# Antes de que funcione: Settings → Secrets and variables → Actions →
# New repository secret → RENDER_URL → https://inedsor-torneo.onrender.com
# (la URL exacta la da Render después del primer deploy).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping del servicio
        run: |
          if [ -z "${{ secrets.RENDER_URL }}" ]; then
            echo "Falta el secret RENDER_URL. Ver comentario arriba del archivo."
            exit 1
          fi
          curl -sf "${{ secrets.RENDER_URL }}" -o /dev/null
